server:
  port: 8080

spring:
  datasource:
    # --- Default Out-of-the-Box In-Memory DB (MySQL compatible, zero setup required) ---
    url: jdbc:h2:mem:cloud_parking_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: 

    # --- To use Local MySQL Server, uncomment below & comment out H2 above: ---
    # url: jdbc:mysql://localhost:3306/cloud_parking_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    # username: root
    # password: admin123
    # driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console
