server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/cloud_parking_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: admin123   # <-- Replace with the root password you set during MySQL installation!
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect